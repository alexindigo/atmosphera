<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "https://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root may own the helper's name -->
  <policy user="root">
    <allow own="app.atmosphera.HwController"/>
  </policy>

  <!-- Anyone may invoke; every method call is polkit-authorized inside
       the helper. Introspection stays open so clients can discover the
       (two-method) API. -->
  <policy context="default">
    <allow send_destination="app.atmosphera.HwController"/>
    <allow send_interface="app.atmosphera.HwController"/>
    <allow send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
