# Atmosphera: xremap config for macOS-style keyboard behavior
#
# Single config — modmap + keymaps together.
# xremap operates at the evdev level, before niri sees key events.
#
# Canonical Mac Layout Modmap (2-way Alt↔Super swap; keyd owns it
# system-wide — this is the session-level belt-and-braces duplicate,
# device-scoped so it's inert once keyd holds the grab):
#   Physical Alt  (next to Space) → Super  (WM actions / macOS Cmd position)
#   Physical Win/Super (left of Alt) → Alt  (Option/word nav)
#   Physical Ctrl (corner)        → Ctrl   (unchanged — terminals/readline
#                                          rely on decades of Ctrl habits)
#
# So in niri binds (logical, post-remap):
#   Super+ → WM actions / app actions (Save, Find, Paste) — press physical Alt
#   Ctrl+  → terminal/readline                          — press corner Ctrl
#   Alt+   → Option actions (word nav)                  — press physical Win
#
# Key name reference:
#   https://github.com/emberian/evdev/blob/master/src/scancodes.rs
#   https://github.com/k0kubun/xremap/blob/master/src/config/key.rs

keypress_delay_ms: 50

modmap:
  - name: Mac-Style Laptop Bottom Row (2-way Alt↔Super swap)
    device:
      only: "AT Translated Set 2 keyboard"
    remap:
      # Physical Alt (next to Space) → Super (macOS Cmd position)
      Alt_L: Super_L
      Alt_R: Super_R
      # Physical Win/Super (left of Alt) → Alt (Option)
      Super_L: Alt_L
      Super_R: Alt_R
      # Ctrl untouched on purpose: terminal/readline muscle memory
      # (Ctrl+C SIGINT, Ctrl+D EOF, Ctrl+Z) stays put.

keymap:
  # macOS text navigation: Cmd+arrows (physical Alt+arrows) → Home/End etc.
  - name: Mac text navigation
    remap:
      Super-Left: Home
      Super-Right: End
      Super-Up: Ctrl-Home
      Super-Down: Ctrl-End

  # Word navigation: Option+arrows (physical Win+arrows) → Ctrl+arrows
  - name: Word navigation
    remap:
      Alt-Left: Ctrl-Left
      Alt-Right: Ctrl-Right
      Alt-Shift-Left: Ctrl-Shift-Left
      Alt-Shift-Right: Ctrl-Shift-Right

  # macOS copy/paste: Cmd+C/V/X → Ctrl+Insert / Shift+Insert / Ctrl+X
  - name: Mac copy-paste
    application:
      not: ["/zed/"]
    remap:
      Super-C: Ctrl_L-Insert
      Super-V: Shift_L-Insert
      Super-X: Ctrl_L-X

  # Terminal copy/paste: Cmd+C/V/X → Ctrl+Shift+C/V/X (terminal convention).
  # Real Ctrl (corner key) passes through untouched (SIGINT/readline).
  - name: Terminal copy-paste
    application:
      only: ["/ghostty/", "/alacritty/", "/kitty/", "/wezterm/", "/foot/"]
    remap:
      Super-c: Ctrl-Shift-c
      Super-v: Ctrl-Shift-v
      Super-x: Ctrl-Shift-x

  # GUI App Actions (non-terminal, non-Zed): Cmd+S/Z/A/G
  - name: GUI App Actions
    application:
      not: ["/ghostty/", "/alacritty/", "/kitty/", "/wezterm/", "/foot/", "/zed/"]
    remap:
      Super-S: Ctrl-S
      Super-Z: Ctrl-Z
      Super-Shift-Z: Ctrl-Shift-Z
      Super-A: Ctrl-A
      Super-G: Ctrl-G
      Super-Shift-G: Ctrl-Shift-G
