# keyd configuration for Atmosphera
# Installed to: /etc/keyd/default.conf
#
# Device IDs can be obtained with: sudo journalctl -eu keyd | grep "device added"
# Reload with: sudo keyd reload
# Panic sequence: backspace + escape + enter

[ids]
# built-in laptop keyboard (AT Translated Set 2)
0001:0001
# touchpad (PIXA3854, listed as both Mouse and Touchpad)
# 093a:0274
# trackpoint/built-in mouse (ImExPS/2)
0002:0006

[main]
# Swap Alt and Super at the keycode level.
# Physical Alt (next to Space) → Super (Cmd)
# Physical Win/Super (left of Alt) → Alt
leftalt = layer(meta)
leftmeta = layer(alt)
rightalt = layer(meta)
rightmeta = layer(alt)

#[meta]

# macOS Cmd+click → Ctrl+click (open link in new tab)
#leftmouse = C-leftmouse
