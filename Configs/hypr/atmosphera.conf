# Atmosphera Hyprland layer (hyprlang syntax, Hyprland < 0.55)
# Installed by atmosphera-hypr-setup to ~/.config/hypr/atmosphera.conf.
# Startup lines (exec-once) are appended by the setup script per route.

# Blur Atmosphera's layer-shell surfaces (bars, panels, OSD).
layerrule = blur, namespace:^atmosphera-.*$
