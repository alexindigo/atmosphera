# Atmosphera hyprlang layer: Hyprland >= 0.53; older versions unsupported.
# Fresh >= 0.55 uses Lua; fresh < 0.55 uses hyprlang; existing configs keep their language.
# Setup installs in the resolved config directory and expands @ATMOSPHERA_INPUT@.

# Blur Atmosphera's layer-shell surfaces (bars, panels, OSD).
layerrule = blur on, match:namespace ^atmosphera-.*$

# Input-method binds, generated by Atmosphera from Settings (InputMethodBinds).
source = @ATMOSPHERA_INPUT@
