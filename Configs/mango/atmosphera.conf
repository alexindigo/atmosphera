# Atmosphera MangoWC layer
# Installed by atmosphera-mango-setup to ~/.config/mango/atmosphera.conf.
# Startup lines (exec-once) are appended by the setup script.

# Shell detection relies on XDG_CURRENT_DESKTOP=mango (also set by most
# mangowc session launchers; setting it here is harmless if duplicated).
env=XDG_CURRENT_DESKTOP,mango
