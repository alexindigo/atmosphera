# Portal backend preference for niri sessions running Atmosphera.
#
# Without a preferred entry, xdg-desktop-portal picks a backend per
# interface in directory-read order ("last-resort fallback") — with
# xdg-desktop-portal-gtk installed that is gtk, so both Settings and
# FileChooser calls bypass the shell entirely. Atmosphera only declares
# the interfaces it implements; everything else still falls through to
# whatever else is installed.
[preferred]
default=atmosphera
