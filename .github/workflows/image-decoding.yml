name: Image decoding

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  consumers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: shell
      - name: Read paired plugin revision
        run: echo "PLUGINS_REF=$(cat shell/.github/image-decoding-plugins-ref)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: alexindigo/atmosphera-plugins
          ref: ${{ env.PLUGINS_REF }}
          persist-credentials: false
          path: plugins
      - name: Build image tools and pinned headless compositor
        run: |
          docker build --memory=2g --memory-swap=2g --cpu-period=100000 --cpu-quota=200000 \
            --build-arg INSTALL_IMAGE_TOOLS=1 \
            --build-arg TRACE_IMV_VIDEO=1 \
            --tag atmosphera-image-tools shell/.devcontainer
          for readers in present absent; do
            docker build --memory=2g --memory-swap=2g --cpu-period=100000 --cpu-quota=200000 \
              --build-arg BASE_IMAGE=atmosphera-image-tools --build-arg QT_READERS="$readers" \
              --tag "atmosphera-image-ci-$readers" --file shell/.devcontainer/image-decoding.Dockerfile shell/.devcontainer
          done
      - name: Real headless Wayland consumers and boundary controls
        run: |
          for readers in present absent; do
            sudo install -d -o 1000 -g 1000 "$RUNNER_TEMP/image-decoding/$readers"
            sudo install -d -o 1000 -g 1000 "$RUNNER_TEMP/image-decoding/$readers/artifacts/video-native"
            printf 'online CPUs: '; getconf _NPROCESSORS_ONLN
            printf 'fixture filesystem: '; stat -f -c %T "$RUNNER_TEMP/image-decoding/$readers"
            args=()
            if [[ $readers == present ]]; then args=(--cohort formats); fi
            docker run --rm --hostname "image-ci-$readers" \
              --memory=2g --memory-swap=2g --pids-limit=2048 --cpus=2 --network=none \
              --env TMPDIR=/home/dev/image-decoding/tmp \
              --env IMV_VIDEO_DIAGNOSTICS=/home/dev/image-decoding/artifacts/video-native \
              --volume "$RUNNER_TEMP/image-decoding/$readers:/home/dev/image-decoding:rw" \
              --volume "$PWD/shell:/home/dev/image-decoding/shell:ro" \
              --volume "$PWD/plugins:/home/dev/image-decoding/plugins:ro" \
              "atmosphera-image-ci-$readers" python3 -B /home/dev/image-decoding/shell/Scripts/dev/image-decoding-ci.py \
              --workspace /home/dev/image-decoding --engine docker \
              --label "$readers" --qt-readers "$readers" "${args[@]}"
          done
      - name: Make generated evidence readable by the runner
        if: always()
        run: |
          for artifact_dir in "$RUNNER_TEMP"/image-decoding/*/artifacts; do
            if [[ -d $artifact_dir ]]; then sudo chown -R "$(id -u):$(id -g)" "$artifact_dir"; fi
          done
      - name: Retain exact consumer, frame and compositor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-decoding-imvqml
          path: |
            ${{ runner.temp }}/image-decoding/present/artifacts
            ${{ runner.temp }}/image-decoding/absent/artifacts
          if-no-files-found: error
