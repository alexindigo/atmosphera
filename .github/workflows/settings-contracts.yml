name: Settings contracts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  settings-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the shared check-tool image
        run: docker build -t atmosphera-settings-check .devcontainer
      - name: Check schema, detached writes and search freshness
        run: |
          mkdir -p "$RUNNER_TEMP/atmosphera-settings"
          docker run --rm --memory=2g --memory-swap=2g --pids-limit=256 --cpus=2 \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/workspaces/atmosphera:ro" \
            --volume "$RUNNER_TEMP/atmosphera-settings:/settings-scratch" \
            --env TMPDIR=/settings-scratch \
            atmosphera-settings-check \
            python3 -B Scripts/dev/settings-contract-check.py
