name: Update AUR Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (vMAJOR.MINOR.PATCH)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aur-sync
  queue: max
  cancel-in-progress: false

jobs:
  aur-sync:
    name: Publish repo-owned AUR recipes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: archlinux:latest
    defaults:
      run:
        shell: bash
    env:
      GIT_SSH_COMMAND: ssh -F /dev/null -i /root/.ssh/id_aur -o IdentityAgent=none -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4
      TAG_NAME: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Install dependencies
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm git base-devel pacman-contrib openssh python

      # Publication policy comes from the maintained branch, not the selected
      # tag: replaying an older recipe must not replay its older publisher.
      - name: Check out publisher
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: publisher
          persist-credentials: false

      - name: Check out release recipes
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG_NAME }}
          path: source
          persist-credentials: false

      - name: Create build user
        run: |
          set -euo pipefail
          useradd -m builduser

      - name: Configure SSH
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m700 /root/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > /root/.ssh/id_aur
          chmod 600 /root/.ssh/id_aur
          timeout 30 ssh-keyscan aur.archlinux.org >> /root/.ssh/known_hosts
          chmod 600 /root/.ssh/known_hosts

      - name: Prepare both AUR repositories
        run: |
          set -euo pipefail
          install -d -m700 /root/aur-sync /root/aur-sync/tmp /root/aur-sync/policy
          install -m600 "$GITHUB_WORKSPACE/publisher/packaging/aur/sync.py" /root/aur-sync/policy/sync.py
          install -d -o builduser -g builduser -m700 /home/builduser/aur-sync /home/builduser/aur-sync/tmp
          # Public reads require no key. Authenticated transport happens only
          # after both keyless preparations/builds and both publisher commits.
          for package in atmosphera atmosphera-git; do
            timeout 180 git clone "https://aur.archlinux.org/$package.git" "/root/aur-sync/$package"
            git -C "/root/aur-sync/$package" config remote.origin.pushurl "ssh://aur@aur.archlinux.org/$package.git"
          done

      - name: Prepare, commit and publish recipes
        run: |
          set -euo pipefail
          trap 'rm -f /root/.ssh/id_aur' EXIT
          for package in atmosphera atmosphera-git; do
            git -C "/root/aur-sync/$package" config user.name 'github-actions[bot]'
            git -C "/root/aur-sync/$package" config user.email 'github-actions[bot]@users.noreply.github.com'
          done
          export TMPDIR=/root/aur-sync/tmp
          python -I /root/aur-sync/policy/sync.py "$TAG_NAME" \
            /root/aur-sync/atmosphera /root/aur-sync/atmosphera-git --push \
            --recipes "$GITHUB_WORKSPACE/source/packaging/aur" \
            --build-user builduser --worker-root /home/builduser/aur-sync/tmp \
            --summary /root/aur-sync/summary.md

      - name: Summarize update
        if: always()
        run: |
          set -euo pipefail
          if [[ -f /root/aur-sync/summary.md ]]; then
            cat /root/aur-sync/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'AUR sync did not reach publication; inspect the failed preparation step.' >> "$GITHUB_STEP_SUMMARY"
          fi
