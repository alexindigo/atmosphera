name: Update AUR Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (vMAJOR.MINOR.PATCH)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aur-sync
  queue: max
  cancel-in-progress: false

jobs:
  aur-sync:
    name: Publish repo-owned AUR recipes
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    defaults:
      run:
        shell: bash
    env:
      GIT_SSH_COMMAND: ssh -i /home/builduser/.ssh/id_aur -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=4
      TAG_NAME: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Install dependencies
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm git base-devel pacman-contrib openssh python

      # Publication policy comes from the maintained branch, not the selected
      # tag: replaying an older recipe must not replay its older publisher.
      - name: Check out publisher
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: publisher
          persist-credentials: false

      - name: Check out release recipes
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG_NAME }}
          path: source
          persist-credentials: false

      - name: Create build user
        run: |
          set -euo pipefail
          useradd -m builduser

      - name: Configure SSH
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p /home/builduser/.ssh
          chmod 700 /home/builduser/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > /home/builduser/.ssh/id_aur
          chmod 600 /home/builduser/.ssh/id_aur
          ssh-keyscan aur.archlinux.org >> /home/builduser/.ssh/known_hosts
          chmod 600 /home/builduser/.ssh/known_hosts
          chown -R builduser:builduser /home/builduser/.ssh

      - name: Prepare both AUR repositories
        run: |
          set -euo pipefail
          mkdir -p /home/builduser/aur-sync/tmp
          cp -r "$GITHUB_WORKSPACE/source/packaging/aur" /home/builduser/aur-sync/recipes
          chown -R builduser:builduser /home/builduser/aur-sync
          runuser -u builduser -- git clone ssh://aur@aur.archlinux.org/atmosphera.git /home/builduser/aur-sync/atmosphera
          runuser -u builduser -- git clone ssh://aur@aur.archlinux.org/atmosphera-git.git /home/builduser/aur-sync/atmosphera-git

      - name: Prepare, commit and publish recipes
        run: |
          set -euo pipefail
          for package in atmosphera atmosphera-git; do
            runuser -u builduser -- git -C "/home/builduser/aur-sync/$package" config user.name 'github-actions[bot]'
            runuser -u builduser -- git -C "/home/builduser/aur-sync/$package" config user.email 'github-actions[bot]@users.noreply.github.com'
          done
          export TMPDIR=/home/builduser/aur-sync/tmp
          runuser -u builduser -- python "$GITHUB_WORKSPACE/publisher/packaging/aur/sync.py" "$TAG_NAME" \
            /home/builduser/aur-sync/atmosphera /home/builduser/aur-sync/atmosphera-git --push \
            --recipes /home/builduser/aur-sync/recipes \
            --summary /home/builduser/aur-sync/summary.md

      - name: Summarize update
        if: always()
        run: |
          set -euo pipefail
          if [[ -f /home/builduser/aur-sync/summary.md ]]; then
            cat /home/builduser/aur-sync/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'AUR sync did not reach publication; inspect the failed preparation step.' >> "$GITHUB_STEP_SUMMARY"
          fi
